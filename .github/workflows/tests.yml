name: tests
on: [push, pull_request]
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: {PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: lbtest}
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/sql_test.sh
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python tests/run_app_tests.py
      - if: failure()
        run: SHOTS=1 python tests/run_app_tests.py || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: screenshots, path: tests/out}
